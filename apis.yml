description: Shulan Health (树兰医疗 / Shulan Medical Management Group) is a Hangzhou-based
  private healthcare group founded in 2014 by academicians Li Lanjuan and Zheng Shusen.
  It integrates hospital services, life-science research, medical education, and incubation
  investment, owning and operating comprehensive medical institutions and providing
  hospital-management services to partner hospitals across China. Services include
  rehabilitation, nutrition, health examinations, regional medical imaging, and remote
  consultation. Its information systems are built internally by subsidiary Huazhuo
  Technology on a self-developed RubikStack hybrid-cloud platform; the group publishes
  no public developer portal or API. Surfaced as a portfolio company of Qiming Venture
  Partners and added to the API Evangelist network as an enrichment lead.
